name: RSI Telegram Alert

on:
  schedule:
    # Läuft jeden Tag um 20:30 UTC (22:30 Uhr deutscher Zeit)
    - cron: '30 20 * * *'
  workflow_dispatch: # Erlaubt es, den Test manuell per Klick zu starten

jobs:
  run-rsi-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: RSI Skript ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_alert.py